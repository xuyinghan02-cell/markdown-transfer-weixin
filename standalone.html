<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown → 微信公众号</title>
  <style>
/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #16161e;
  --surface:   #1f1f2e;
  --surface2:  #252535;
  --border:    #32324a;
  --text:      #c9d1e0;
  --text-dim:  #7a7f96;
  --accent:    #7aa2f7;
  --success:   #9ece6a;
  --warn:      #e0af68;
  --danger:    #f7768e;
  --header-h:  52px;
  --pane-hd-h: 40px;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

/* ── App Header ───────────────────────────────────────────── */
.app-header {
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 20px;
  flex-shrink: 0;
  user-select: none;
}

.app-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.app-logo svg {
  color: var(--accent);
}

.app-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

/* ── Controls ─────────────────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.ctrl {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
}

.ctrl label { white-space: nowrap; }

.ctrl select,
.ctrl input[type="range"],
.ctrl input[type="color"] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
}

.ctrl select { padding: 3px 6px; }
.ctrl select:focus { border-color: var(--accent); }

.ctrl input[type="range"] {
  width: 72px;
  padding: 0;
  height: 4px;
  accent-color: var(--accent);
  border: none;
}

.ctrl input[type="color"] {
  width: 28px;
  height: 24px;
  padding: 2px 3px;
  border-radius: 4px;
}

.ctrl .val {
  font-size: 11px;
  color: var(--text);
  min-width: 30px;
  font-variant-numeric: tabular-nums;
}

/* ── Main Layout ──────────────────────────────────────────── */
.app-body {
  height: calc(100vh - var(--header-h));
  display: flex;
  overflow: hidden;
}

/* ── Pane ─────────────────────────────────────────────────── */
.pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.pane-hd {
  height: var(--pane-hd-h);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  flex-shrink: 0;
}

.pane-hd-left,
.pane-hd-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pane-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Divider ──────────────────────────────────────────────── */
.divider {
  width: 1px;
  background: var(--border);
  flex-shrink: 0;
}

/* ── Editor Pane ──────────────────────────────────────────── */
.editor-pane { background: #13131c; }

#editor {
  flex: 1;
  width: 100%;
  padding: 18px 20px;
  background: #13131c;
  color: #c9d1e0;
  border: none;
  outline: none;
  resize: none;
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
  font-size: 13.5px;
  line-height: 1.7;
  caret-color: var(--accent);
  tab-size: 2;
}

#editor::placeholder { color: #3a3a52; }

/* ── Upload button ────────────────────────────────────────── */
.upload-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  white-space: nowrap;
}
.upload-label:hover { border-color: var(--accent); color: var(--accent); }

/* Stats */
.stats {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  gap: 8px;
}

/* ── Preview Pane ─────────────────────────────────────────── */
.preview-pane { background: #f0f0f0; }
.preview-pane .pane-hd { background: #e8e8e8; border-bottom: 1px solid #d0d0d0; }
.preview-pane .pane-title { color: #888; }

.preview-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 16px;
  background: #f0f0f0;
}

.preview-card {
  max-width: 680px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 4px;
  padding: 28px 32px 44px;
  min-height: 300px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
}

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  outline: none;
  transition: opacity 0.15s, background-color 0.15s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.88; }
.btn:active { opacity: 0.75; }

.btn-primary {
  background: #07c160;
  color: #fff;
}

.btn-secondary {
  background: #fff;
  color: #555;
  border: 1px solid #d0d0d0;
}
.btn-secondary:hover { border-color: #07c160; color: #07c160; }

/* ── Toast ────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.25s ease, transform 0.25s ease;
  white-space: nowrap;
  max-width: 90vw;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast--success { background: #1a1a2e; color: #9ece6a; border: 1px solid #2a2a3e; }
.toast--warn    { background: #1a1a2e; color: #e0af68; border: 1px solid #2a2a3e; }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3a3a54; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #5a5a7a; }

.preview-scroll::-webkit-scrollbar-thumb { background: #c8c8c8; }
.preview-scroll::-webkit-scrollbar-thumb:hover { background: #aaa; }

/* ── Responsive narrow window ─────────────────────────────── */
@media (max-width: 720px) {
  .app-body { flex-direction: column; }
  .divider { width: 100%; height: 1px; }
  .pane { min-height: 40vh; }
  .controls { gap: 10px; }
  .ctrl input[type="range"] { width: 52px; }
}

/* ── Modal System ─────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 10000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; width: min(580px, 93vw);
  max-height: 84vh; display: flex; flex-direction: column;
  transform: translateY(14px); transition: transform 0.2s;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-hd {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.modal-title { font-size: 14px; font-weight: 600; color: var(--text); }
.modal-x {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 20px; line-height: 1; padding: 0 5px; border-radius: 4px;
}
.modal-x:hover { background: var(--bg); color: var(--text); }
.modal-bd { padding: 18px; overflow-y: auto; flex: 1; }
.modal-ft {
  padding: 12px 18px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0;
}

/* ── Form ─────────────────────────────────────────────────── */
.fg { margin-bottom: 14px; }
.fg:last-child { margin-bottom: 0; }
.fl { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
.fi {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); border-radius: 5px; padding: 7px 10px;
  font-size: 13px; outline: none; transition: border-color 0.15s; font-family: inherit;
}
.fi:focus { border-color: var(--accent); }
textarea.fi { resize: vertical; min-height: 80px; line-height: 1.5; }
.fhint { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }
.fhint a { color: var(--accent); text-decoration: none; }
.frow { display: flex; gap: 8px; align-items: center; }
.frow .fi { flex: 1; }
.frow input[type="color"] {
  width: 34px; height: 34px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg); padding: 2px 3px; cursor: pointer; flex-shrink: 0;
}
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 500px) { .fgrid { grid-template-columns: 1fr; } }

/* ── Tabs ─────────────────────────────────────────────────── */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-btn {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-dim); cursor: pointer; padding: 8px 14px; font-size: 12px;
  margin-bottom: -1px; transition: color 0.15s, border-color 0.15s;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── Theme list ───────────────────────────────────────────── */
.tl { list-style: none; display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.tl-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px;
}
.tl-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
.tl-name { flex: 1; font-size: 13px; color: var(--text); }
.tl-badge {
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  background: var(--border); color: var(--text-dim);
}
.tl-actions { display: flex; gap: 5px; }
.tl-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
}
.tl-btn:hover { border-color: var(--accent); color: var(--accent); }
.tl-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

/* ── Status ───────────────────────────────────────────────── */
.ns {
  padding: 10px 14px; border-radius: 6px; font-size: 12px;
  margin-top: 12px; display: none; line-height: 1.5;
}
.ns.show { display: block; }
.ns.loading { background: var(--surface2); color: var(--accent); border: 1px solid var(--border); }
.ns.ok  { background: var(--surface2); color: var(--success); border: 1px solid var(--border); }
.ns.err { background: var(--surface2); color: var(--danger); border: 1px solid var(--border); }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="app-logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    <h1 class="app-title">Markdown → 微信公众号</h1>
  </div>
  <div class="controls">
    <div class="ctrl">
      <label for="theme-select">主题</label>
      <select id="theme-select">
        <option value="default">默认简洁</option>
        <option value="tech">科技感</option>
        <option value="literary" selected>文艺清新</option>
        <option value="magazine">现代杂志</option>
      </select>
    </div>
    <div class="ctrl">
      <label for="font-size">字号</label>
      <input type="range" id="font-size" min="13" max="19" value="15" step="1">
      <span class="val" id="font-size-val">15px</span>
    </div>
    <div class="ctrl">
      <label for="line-height">行高</label>
      <input type="range" id="line-height" min="1.4" max="2.2" value="1.75" step="0.05">
      <span class="val" id="line-height-val">1.75</span>
    </div>
    <div class="ctrl">
      <label for="accent-color">主色</label>
      <input type="color" id="accent-color" value="#07c160">
    </div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;">
    <button class="btn btn-secondary" onclick="openModal('notion-modal')" style="padding:3px 10px;font-size:12px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6H4z"/><path d="M17 17m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/></svg>
      Notion
    </button>
    <button class="btn btn-secondary" onclick="openThemeManager()" style="padding:3px 10px;font-size:12px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
      主题管理
    </button>
  </div>
</header>

<div class="app-body">
  <div class="pane editor-pane">
    <div class="pane-hd">
      <div class="pane-hd-left">
        <span class="pane-title">编辑</span>
        <label class="upload-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          上传文件
          <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden>
        </label>
      </div>
      <div class="pane-hd-right">
        <div class="stats">
          <span id="char-count">0 字符</span>
          <span id="word-count">中文 0 字</span>
        </div>
      </div>
    </div>
    <textarea id="editor" placeholder="在此输入 Markdown 内容，或上传 .md 文件…"></textarea>
  </div>
  <div class="divider"></div>
  <div class="pane preview-pane">
    <div class="pane-hd">
      <div class="pane-hd-left">
        <span class="pane-title">预览</span>
      </div>
      <div class="pane-hd-right">
        <button class="btn btn-secondary" id="copy-html-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/>
            <polyline points="8 6 2 12 8 18"/>
          </svg>
          复制 HTML
        </button>
        <button class="btn btn-primary" id="copy-rich-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          复制富文本
        </button>
      </div>
    </div>
    <div class="preview-scroll">
      <div class="preview-card">
        <div id="preview"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast toast--success" id="toast"></div>

<!-- ── Notion Import Modal ──────────────────────────────── -->
<div class="modal-overlay" id="notion-modal">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title">从 Notion 导入</span>
      <button class="modal-x" onclick="closeModal('notion-modal')">×</button>
    </div>
    <div class="modal-bd">
      <div class="fg">
        <label class="fl">Integration Token（Internal Integration Secret）</label>
        <input class="fi" id="notion-token" type="password" placeholder="secret_xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off">
        <div class="fhint">在 notion.so/my-integrations 创建 Integration 后获取 Token，并将目标页面分享给该 Integration</div>
      </div>
      <div class="fg">
        <label class="fl">页面 URL 或页面 ID</label>
        <input class="fi" id="notion-page" placeholder="https://www.notion.so/... 或 32位页面ID">
      </div>
      <div class="fg">
        <label class="fl">CORS 代理前缀（解决跨域，可选）</label>
        <input class="fi" id="notion-proxy" placeholder="例：https://corsproxy.io/?url=">
        <div class="fhint">浏览器直连 Notion API 会被 CORS 拦截。可使用第三方代理，或本地运行 <code style="color:var(--accent)">node notion-proxy.js</code> 后填 <code style="color:var(--accent)">http://localhost:3100/</code></div>
      </div>
      <div class="fg">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-dim);">
          <input type="checkbox" id="notion-auto-copy" checked>
          导入完成后自动复制富文本到剪切板
        </label>
      </div>
      <div class="ns" id="notion-status"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-secondary" onclick="closeModal('notion-modal')">取消</button>
      <button class="btn btn-primary" id="notion-fetch-btn" onclick="fetchNotion()">获取并转换</button>
    </div>
  </div>
</div>

<!-- ── Theme Manager Modal ──────────────────────────────── -->
<div class="modal-overlay" id="theme-modal">
  <div class="modal" style="width:min(640px,94vw)">
    <div class="modal-hd">
      <span class="modal-title" id="theme-modal-title">主题管理</span>
      <button class="modal-x" onclick="closeModal('theme-modal')">×</button>
    </div>
    <div class="modal-bd" id="theme-modal-bd"></div>
    <div class="modal-ft" id="theme-modal-ft"></div>
  </div>
</div>

<script>
/**
 * 主题定义
 * 每个主题包含默认变量和样式生成函数
 * 所有样式均为 inline style，确保微信公众号兼容性
 */
const THEMES = {
  default: {
    name: '默认简洁',
    vars: {
      accentColor: '#07c160',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif',
      fontSize: 15,
      lineHeight: 1.75,
      textColor: '#333333',
      mutedColor: '#666666',
    },
    styles(vars) {
      return {
        wrapper: `font-family: ${vars.fontFamily}; font-size: ${vars.fontSize}px; color: ${vars.textColor}; line-height: ${vars.lineHeight}; word-wrap: break-word; -webkit-text-size-adjust: 100%;`,
        h1: `display: block; font-size: 22px; font-weight: bold; color: #1a1a1a; margin: 28px 0 14px 0; line-height: 1.4; text-align: center; letter-spacing: 1px;`,
        h2: `display: block; font-size: 18px; font-weight: bold; color: #1a1a1a; margin: 24px 0 12px 0; line-height: 1.4; border-bottom: 2px solid ${vars.accentColor}; padding-bottom: 6px;`,
        h3: `display: block; font-size: ${vars.fontSize + 2}px; font-weight: bold; color: #1a1a1a; margin: 20px 0 10px 0; line-height: 1.4; padding-left: 10px; border-left: 3px solid ${vars.accentColor};`,
        h4: `display: block; font-size: ${vars.fontSize + 1}px; font-weight: bold; color: #1a1a1a; margin: 16px 0 8px 0; line-height: 1.4;`,
        h5: `display: block; font-size: ${vars.fontSize}px; font-weight: bold; color: #555555; margin: 14px 0 7px 0; line-height: 1.4;`,

<script>
/**
 * Markdown → 微信公众号富文本转换器
 * 使用 marked.js 自定义渲染器，为每个元素注入 inline style
 */

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function createRenderer(styles) {
  const renderer = new marked.Renderer();

  // 标题
  renderer.heading = function (text, level) {
    const style = styles[`h${level}`] || styles.h6;
    return `<h${level} style="${style}">${text}</h${level}>\n`;
  };

  // 段落 —— 图片单独处理，不加 text-indent
  renderer.paragraph = function (text) {
    const isOnlyImage = /^<img[^>]*>$/.test(text.trim());
    if (isOnlyImage) {
      return `<p style="text-align: center; margin: 16px 0;">${text}</p>\n`;
    }
    return `<p style="${styles.p}">${text}</p>\n`;
  };

  // 加粗
  renderer.strong = function (text) {
    return `<strong style="${styles.strong}">${text}</strong>`;
  };

  // 斜体
  renderer.em = function (text) {
    return `<em style="${styles.em}">${text}</em>`;
  };

  // 删除线
  renderer.del = function (text) {
    return `<del style="${styles.del}">${text}</del>`;
  };

  // 行内代码
  renderer.codespan = function (code) {
    return `<code style="${styles.inlineCode}">${code}</code>`;
  };

  // 代码块
  renderer.code = function (code, infostring) {
    const escaped = escapeHtml(code);
    const lang = infostring ? infostring.split(/\s+/)[0] : '';
    const langLabel = lang
      ? `<span style="display:block;font-size:11px;color:#999;margin-bottom:8px;font-family:sans-serif;">${lang}</span>`
      : '';
    return `<pre style="${styles.pre}">${langLabel}<code style="${styles.preCode}">${escaped}</code></pre>\n`;
  };

  // 引用块
  renderer.blockquote = function (quote) {
    return `<blockquote style="${styles.blockquote}">${quote}</blockquote>\n`;
  };

  // 列表
  renderer.list = function (body, ordered, start) {
    const tag = ordered ? 'ol' : 'ul';
    const style = ordered ? styles.ol : styles.ul;
    const startAttr = (ordered && start !== 1) ? ` start="${start}"` : '';
    return `<${tag}${startAttr} style="${style}">${body}</${tag}>\n`;
  };

  // 列表项
  renderer.listitem = function (text) {
    return `<li style="${styles.li}">${text}</li>\n`;
  };

  // 链接
  renderer.link = function (href, title, text) {
    const titleAttr = title ? ` title="${escapeHtml(title)}"` : '';
    return `<a href="${href}"${titleAttr} style="${styles.a}">${text}</a>`;
  };

  // 图片
  renderer.image = function (href, title, text) {
    const altAttr = text ? ` alt="${escapeHtml(text)}"` : '';
    const titleAttr = title ? ` title="${escapeHtml(title)}"` : '';
    return `<img src="${href}"${altAttr}${titleAttr} style="${styles.img}">`;
  };

  // 分隔线
  renderer.hr = function () {
    return `<hr style="${styles.hr}">\n`;
  };

  // 表格
  renderer.table = function (header, body) {
    return `<table style="${styles.table}"><thead>${header}</thead><tbody>${body}</tbody></table>\n`;
  };

  renderer.tablerow = function (content) {
    return `<tr>${content}</tr>\n`;
  };

  renderer.tablecell = function (content, flags) {
    const tag = flags.header ? 'th' : 'td';
    const baseStyle = flags.header ? styles.th : styles.td;
    const alignStyle = flags.align ? ` text-align: ${flags.align};` : '';
    return `<${tag} style="${baseStyle}${alignStyle}">${content}</${tag}>`;
  };

  // 换行
  renderer.br = function () {
    return '<br>';
  };

  return renderer;
}

/**
 * 将 Markdown 转换为适合微信公众号的内联样式 HTML
 * @param {string} markdown - 输入的 Markdown 文本
 * @param {object} theme - 主题对象（来自 themes.js）
 * @param {object} overrides - 覆盖变量（fontSize, lineHeight, accentColor 等）
 * @returns {string} 带内联样式的 HTML 字符串
 */
function convertMarkdown(markdown, theme, overrides = {}) {
  if (!markdown || !markdown.trim()) return '';

  // 合并变量：主题默认值 + 用户覆盖
  const vars = Object.assign({}, theme.vars, overrides);
  const styles = theme.styles(vars);

  const renderer = createRenderer(styles);

  marked.setOptions({
    renderer,
    breaks: true,    // 单个换行转为 <br>
    gfm: true,       // GitHub Flavored Markdown
    headerIds: false, // 不生成 id 属性（减少无用属性）
    mangle: false,
  });

  const body = marked.parse(markdown);

  // 用 section 包裹，赋予基础样式，section 在微信中更稳定
  return `<section style="${styles.wrapper}">${body}</section>`;
}

<script>
/**

// ── 示例内容 ────────────────────────────────────────────────
const DEMO_MARKDOWN = `# 标题：用 Markdown 写公众号

## 一、为什么需要这个工具

日常写作习惯用 **Markdown**，但微信公众号编辑器不支持直接渲染。手动排版费时费力，而且样式不统一。

本工具将 Markdown 转换为带 **内联样式** 的富文本，直接粘贴到公众号编辑器即可使用。

## 二、支持的格式

}

console.log(greet('世界'));
\`\`\`

### 引用块

> 工具的价值在于让创作者专注于内容本身，而非排版细节。

### 列表

- 支持加粗、斜体、删除线

| 列表 | ✅ | 有序 / 无序 |

| 图片 | ✅ | 需公网地址 |

*感谢使用！如有问题欢迎反馈。*
`;

// ── DOM 引用 ────────────────────────────────────────────────
const editor      = document.getElementById('editor');
const preview     = document.getElementById('preview');
const themeSelect = document.getElementById('theme-select');
const fontSizeInput   = document.getElementById('font-size');
const fontSizeVal     = document.getElementById('font-size-val');
const lineHeightInput = document.getElementById('line-height');
const lineHeightVal   = document.getElementById('line-height-val');
const accentColorInput = document.getElementById('accent-color');
const copyRichBtn = document.getElementById('copy-rich-btn');
const copyHtmlBtn = document.getElementById('copy-html-btn');
const fileInput   = document.getElementById('file-input');
const toast       = document.getElementById('toast');
const charCount   = document.getElementById('char-count');
const wordCount   = document.getElementById('word-count');

// ── 状态 ────────────────────────────────────────────────────
let currentTheme = THEMES.literary;
let overrides = {};
let toastTimer = null;

// ── 渲染 ────────────────────────────────────────────────────
function render() {
  const md = editor.value;
  preview.innerHTML = convertMarkdown(md, currentTheme, overrides);
  updateStats(md);
}

function updateStats(md) {
  const chars = md.length;
  // 按中文字符 + 英文单词统计
  const chinese = (md.match(/[\u4e00-\u9fa5]/g) || []).length;
  const words   = (md.match(/[a-zA-Z]+/g) || []).length;
  charCount.textContent = `${chars} 字符`;
  wordCount.textContent = `中文 ${chinese} 字`;
}

// ── Toast 提示 ───────────────────────────────────────────────
function showToast(msg, type = 'success') {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = `toast toast--${type} show`;
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// ── 复制富文本 ───────────────────────────────────────────────
async function copyRichText() {
  const html = preview.innerHTML;
  if (!html) { showToast('没有内容可复制', 'warn'); return; }

  // 优先使用 ClipboardItem（现代浏览器）
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
    try {
      const blob = new Blob([html], { type: 'text/html' });
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
      showToast('✓ 富文本已复制，可直接粘贴到微信公众号编辑器');
      return;
    } catch (e) {
      // 降级处理
    }
  }

  // 降级：用 Selection + execCommand
  const tmpDiv = document.createElement('div');
  tmpDiv.innerHTML = html;
  tmpDiv.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(tmpDiv);
  try {
    const range = document.createRange();
    range.selectNodeContents(tmpDiv);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    showToast('✓ 富文本已复制（兼容模式）');
  } catch (e) {
    showToast('复制失败，请手动全选预览区域复制', 'warn');
  } finally {
    document.body.removeChild(tmpDiv);
  }
}

// ── 复制 HTML 源码 ───────────────────────────────────────────
async function copyHtmlSource() {
  const html = preview.innerHTML;
  if (!html) { showToast('没有内容可复制', 'warn'); return; }
  try {
    await navigator.clipboard.writeText(html);
    showToast('✓ HTML 源码已复制');
  } catch (e) {
    showToast('复制失败', 'warn');
  }
}

// ── 主题切换 ─────────────────────────────────────────────────
function applyTheme(themeKey) {
  // Support built-in and custom: themes
  currentTheme = (typeof getTheme === 'function') ? getTheme(themeKey) : (THEMES[themeKey] || THEMES.default);
  overrides = {};
  const v = currentTheme.vars;
  fontSizeInput.value    = v.fontSize;
  fontSizeVal.textContent = v.fontSize + 'px';
  lineHeightInput.value  = v.lineHeight;
  lineHeightVal.textContent = parseFloat(v.lineHeight).toFixed(2);
  accentColorInput.value = v.accentColor;
  render();
}

// ── 事件绑定 ─────────────────────────────────────────────────
editor.addEventListener('input', render);

themeSelect.addEventListener('change', () => applyTheme(themeSelect.value));

fontSizeInput.addEventListener('input', () => {
  const val = parseInt(fontSizeInput.value);
  fontSizeVal.textContent = val + 'px';
  overrides.fontSize = val;
  render();
});

lineHeightInput.addEventListener('input', () => {
  const val = parseFloat(lineHeightInput.value).toFixed(2);
  lineHeightVal.textContent = val;
  overrides.lineHeight = parseFloat(val);
  render();
});

accentColorInput.addEventListener('input', () => {
  overrides.accentColor = accentColorInput.value;
  render();
});

copyRichBtn.addEventListener('click', copyRichText);
copyHtmlBtn.addEventListener('click', copyHtmlSource);

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 1024 * 1024) { // 1MB 限制
    showToast('文件过大（最大 1MB）', 'warn');
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    editor.value = ev.target.result;
    render();
    showToast(`✓ 已加载：${file.name}`);
  };
  reader.readAsText(file, 'UTF-8');
  fileInput.value = '';
});

// 支持拖拽文件到编辑区
editor.addEventListener('dragover', (e) => e.preventDefault());
editor.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    editor.value = ev.target.result;
    render();
    showToast(`✓ 已加载：${file.name}`);
  };
  reader.readAsText(file, 'UTF-8');
});

// Tab 键缩进
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end   = editor.selectionEnd;
    editor.value = editor.value.slice(0, start) + '  ' + editor.value.slice(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
  }
});

// ── 初始化 ───────────────────────────────────────────────────
editor.value = DEMO_MARKDOWN;
render();
populateThemeSelect();
// 恢复上次保存的 Notion token / proxy
const _nt = localStorage.getItem('notion_token');
const _np = localStorage.getItem('notion_proxy');
if (_nt) document.getElementById('notion-token').value = _nt;
if (_np) document.getElementById('notion-proxy').value = _np;

</script>

<script>
/* ═══════════════════════════════════════════════════════════
   Custom Theme Manager
═══════════════════════════════════════════════════════════ */
const CTHEME_KEY = 'wx_custom_themes_v2';

function loadCustomThemes() {
  try { return JSON.parse(localStorage.getItem(CTHEME_KEY) || '{}'); }
  catch { return {}; }
}
function saveCustomThemes(obj) {
  localStorage.setItem(CTHEME_KEY, JSON.stringify(obj));
}

let customThemes = loadCustomThemes();

/**
 * Build a runtime theme object from stored custom theme data.
 * Custom themes inherit the styles() of a base built-in theme, but
 * allow overriding any individual element style via styleOverrides.
 */
function buildCustomTheme(data) {
  const base = THEMES[data.base || 'default'] || THEMES.default;
  const vars = Object.assign({}, base.vars, data.vars || {});
  const baseStyles = base.styles(vars);
  const styles = Object.assign({}, baseStyles, data.styleOverrides || {});
  return {
    name: data.name,
    vars,
    styles: () => styles,
  };
}

function getTheme(key) {
  if (key && key.startsWith('custom:')) {
    const ckey = key.slice(7);
    if (customThemes[ckey]) return buildCustomTheme(customThemes[ckey]);
  }
  return THEMES[key] || THEMES.default;
}

function populateThemeSelect() {
  // Remove existing custom options (index >= 3)
  while (themeSelect.options.length > 3) themeSelect.remove(3);
  Object.entries(customThemes).forEach(([k, t]) => {
    const opt = document.createElement('option');
    opt.value = 'custom:' + k;
    opt.textContent = t.name || k;
    themeSelect.appendChild(opt);
  });
}

// ── Theme Manager UI ─────────────────────────────────────────

function openThemeManager() {
  renderThemeList();
  openModal('theme-modal');
}

function renderThemeList() {
  document.getElementById('theme-modal-title').textContent = '主题管理';
  const bd = document.getElementById('theme-modal-bd');
  const ft = document.getElementById('theme-modal-ft');

  const builtins = [
    { key: 'default',  label: '默认简洁', color: '#07c160' },
    { key: 'tech',     label: '科技感',   color: '#4f9cf9' },
    { key: 'literary', label: '文艺清新', color: '#8b1a1a' },
    { key: 'magazine', label: '现代杂志', color: '#c0392b' },
  ];

  let html = '<ul class="tl">';
  builtins.forEach(({ key, label, color }) => {
    html += `<li class="tl-item">

      <span class="tl-name">${label}</span>
      <span class="tl-badge">内置</span>

  });
  Object.entries(customThemes).forEach(([k, t]) => {

      <span class="tl-dot" style="background:${color}"></span>
      <span class="tl-name">${escHtml(t.name || k)}</span>

      <div class="tl-actions">
        <button class="tl-btn" onclick="editCustomTheme('${k}')">编辑</button>
        <button class="tl-btn danger" onclick="deleteCustomTheme('${k}')">删除</button>
      </div>
    </li>`;
  });
  html += '</ul>';

  bd.innerHTML = html;
  ft.innerHTML = `
    <button class="btn btn-secondary" onclick="closeModal('theme-modal')">关闭</button>
    <button class="btn btn-secondary" onclick="showExtractPanel()">从公众号提取</button>
    <button class="btn btn-primary" onclick="showThemeEditor(null)">+ 新建主题</button>
  `;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/**
 * Show theme editor.
 * key=null → create new; key=string → edit existing custom theme

 */
function showThemeEditor(key, preData) {

  const bd = document.getElementById('theme-modal-bd');

      <button class="tab-btn active" onclick="switchTab(this,'tab-basic')">基础设置</button>
      <button class="tab-btn" onclick="switchTab(this,'tab-adv')">样式覆盖 (JSON)</button>

    <div class="tab-pane active" id="tab-basic">

        <div class="fg">

            <option value="literary" ${base==='literary'?'selected':''}>文艺清新</option>
          </select>
        </div>
      </div>
      <div class="fgrid">

          <label class="fl">主色 (accentColor)</label>
          <div class="frow">
            <input type="color" id="te-accent" value="${vars.accentColor || '#07c160'}">

        <div class="fg">

          <div class="frow">
            <input type="color" id="te-text" value="${vars.textColor || '#333333'}">

        <div class="fg">
          <label class="fl">行高 (lineHeight)</label>
          <div class="frow">
            <input type="range" min="1.4" max="2.2" step="0.05" id="te-lh" value="${vars.lineHeight || 1.75}" style="flex:1;accent-color:var(--accent);">
            <span id="te-lh-val" style="min-width:36px;font-size:12px;color:var(--text)">${parseFloat(vars.lineHeight || 1.75).toFixed(2)}</span>
          </div>
        </div>
        <div class="fg" style="grid-column:1/-1">
          <label class="fl">字体 (fontFamily)</label>
          <input class="fi" id="te-font" value="${escHtml(vars.fontFamily || '')}" placeholder="留空使用继承主题的字体">
        </div>
      </div>
    </div>

    <div class="tab-pane" id="tab-adv">
      <div class="fg">
        <label class="fl">元素样式覆盖 (JSON，键为元素名如 h1 h2 p blockquote 等，值为完整 CSS 字符串)</label>
        <textarea class="fi" id="te-overrides" rows="12" style="font-family:monospace;font-size:12px;">${escHtml(overridesJson)}</textarea>
        <div class="fhint">可覆盖的键：h1 h2 h3 h4 h5 h6 p strong em del inlineCode pre preCode blockquote ul ol li a img hr table th td wrapper</div>
      </div>
    </div>

    <div class="tab-pane" id="tab-import">
      <div class="fg">
        <label class="fl">导出当前主题 (JSON)</label>
        <textarea class="fi" id="te-export-area" rows="6" readonly style="font-family:monospace;font-size:12px;"></textarea>
        <button class="btn btn-secondary" style="margin-top:6px;font-size:12px;" onclick="exportThemeJson('${key||''}')">生成导出 JSON</button>
      </div>
      <div class="fg" style="margin-top:14px;">
        <label class="fl">导入主题 JSON（粘贴后点击导入）</label>
        <textarea class="fi" id="te-import-area" rows="6" placeholder='{"name":"...","base":"default","vars":{...},"styleOverrides":{...}}' style="font-family:monospace;font-size:12px;"></textarea>
        <button class="btn btn-secondary" style="margin-top:6px;font-size:12px;" onclick="importThemeJson()">导入</button>
      </div>

  `;

  // sync color pickers ↔ hex inputs
  ['accent','text','muted'].forEach(id => {
    const picker = document.getElementById('te-' + id);
    const hex    = document.getElementById('te-' + id + '-hex');
    picker.addEventListener('input', () => hex.value = picker.value);
    hex.addEventListener('input', () => {
      if (/^#[0-9a-f]{6}$/i.test(hex.value)) picker.value = hex.value;
    });
  });
  document.getElementById('te-fs').addEventListener('input', function() {
    document.getElementById('te-fs-val').textContent = this.value + 'px';
  });
  document.getElementById('te-lh').addEventListener('input', function() {
    document.getElementById('te-lh-val').textContent = parseFloat(this.value).toFixed(2);
  });

  const ft = document.getElementById('theme-modal-ft');
  ft.innerHTML = `
    <button class="btn btn-secondary" onclick="renderThemeList(); document.getElementById('theme-modal-title').textContent='主题管理';">← 返回</button>

function switchTab(btn, paneId) {
  btn.closest('.modal-bd').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.closest('.modal-bd').querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(paneId).classList.add('active');
}

function saveThemeEditor(editKey) {
  const name = document.getElementById('te-name').value.trim() || '自定义主题';
  let overrides = {};
  try {
    overrides = JSON.parse(document.getElementById('te-overrides').value || '{}');
    if (typeof overrides !== 'object' || Array.isArray(overrides)) throw new Error();
  } catch {
    alert('样式覆盖 JSON 格式错误，请检查。'); return;
  }

  const fontVal = document.getElementById('te-font').value.trim();
  const vars = {
    accentColor: document.getElementById('te-accent-hex').value || document.getElementById('te-accent').value,
    textColor:   document.getElementById('te-text-hex').value   || document.getElementById('te-text').value,
    mutedColor:  document.getElementById('te-muted-hex').value  || document.getElementById('te-muted').value,
    fontSize:    parseInt(document.getElementById('te-fs').value),
    lineHeight:  parseFloat(document.getElementById('te-lh').value),
  };
  if (fontVal) vars.fontFamily = fontVal;

  const key = editKey || ('t' + Date.now());
  customThemes[key] = {
    name,
    base: document.getElementById('te-base').value,
    vars,
    styleOverrides: overrides,
  };
  saveCustomThemes(customThemes);
  populateThemeSelect();
  renderThemeList();
  document.getElementById('theme-modal-title').textContent = '主题管理';
  showToast('✓ 主题已保存：' + name);
}

function editCustomTheme(key) { showThemeEditor(key); }

function deleteCustomTheme(key) {
  if (!confirm('确定删除主题「' + (customThemes[key]?.name || key) + '」？')) return;
  delete customThemes[key];
  saveCustomThemes(customThemes);
  populateThemeSelect();
  // If current theme was this one, revert to default
  if (themeSelect.value === 'custom:' + key) {
    themeSelect.value = 'default';
    applyTheme('default');
  }
  renderThemeList();
}

function exportThemeJson(editKey) {
  const name = document.getElementById('te-name')?.value.trim() || '自定义主题';
  let overrides = {};
  try { overrides = JSON.parse(document.getElementById('te-overrides').value || '{}'); } catch {}
  const fontVal = document.getElementById('te-font').value.trim();
  const vars = {
    accentColor: document.getElementById('te-accent-hex').value,
    textColor:   document.getElementById('te-text-hex').value,
    mutedColor:  document.getElementById('te-muted-hex').value,
    fontSize:    parseInt(document.getElementById('te-fs').value),
    lineHeight:  parseFloat(document.getElementById('te-lh').value),
  };
  if (fontVal) vars.fontFamily = fontVal;
  const data = { name, base: document.getElementById('te-base').value, vars, styleOverrides: overrides };
  document.getElementById('te-export-area').value = JSON.stringify(data, null, 2);
}

function importThemeJson() {
  try {
    const data = JSON.parse(document.getElementById('te-import-area').value);
    if (!data.name) throw new Error('缺少 name 字段');
    const key = 't' + Date.now();
    customThemes[key] = data;
    saveCustomThemes(customThemes);
    populateThemeSelect();
    showToast('✓ 已导入主题：' + data.name);
    renderThemeList();
    document.getElementById('theme-modal-title').textContent = '主题管理';
  } catch(e) {
    alert('JSON 解析失败：' + e.message);
  }
}

// ── 从公众号文章提取主题 ──────────────────────────────────────

function showExtractPanel() {
  document.getElementById('theme-modal-title').textContent = '从公众号文章提取主题';
  const bd = document.getElementById('theme-modal-bd');
  const ft = document.getElementById('theme-modal-ft');

  bd.innerHTML = `
    <p class="fhint" style="margin-bottom:10px;">分析公众号文章的排版样式，自动生成匹配的自定义主题，再手动微调后保存。</p>

    <div class="fgrid" style="margin-bottom:10px;">
      <div class="fg">
        <label class="fl">继承基础主题 <span style="color:var(--text-muted,#888);font-weight:normal;">（决定未提取到的元素的默认排版）</span></label>
        <select class="fi" id="wx-base-select">
          <option value="default" selected>默认简洁（推荐）</option>

      </div>

    <div class="tab-pane active" id="ext-tab-html">
      <div class="fg">
        <label class="fl">粘贴文章 HTML 源码</label>
        <div class="fhint">在浏览器打开公众号文章 → 按 <b>Ctrl+U</b>（Mac: <b>⌘+U</b>）查看源码 → 全选（Ctrl+A）→ 复制后粘贴到下方</div>
        <textarea class="fi" id="wx-html-input" rows="10" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;..." style="font-family:monospace;font-size:11px;margin-top:6px;"></textarea>
      </div>
    </div>

    <div class="tab-pane" id="ext-tab-url">

      </div>
      <div class="fg">
        <label class="fl">CORS 代理前缀（可选）</label>
        <input class="fi" id="wx-proxy-input" placeholder="例：https://corsproxy.io/?url=">
        <div class="fhint">浏览器直连微信服务器会被 CORS 拦截，建议配置代理或改用「粘贴 HTML」方式。</div>
      </div>
      <button class="btn btn-secondary" style="margin-top:6px;font-size:12px" onclick="fetchWxArticle()">获取文章 HTML</button>
      <div id="wx-fetch-status" style="font-size:12px;margin-top:8px;"></div>

    <div id="wx-extract-status" style="font-size:12px;margin-top:8px;color:#e74c3c;"></div>
  `;

  ft.innerHTML = `
    <button class="btn btn-secondary" onclick="renderThemeList(); document.getElementById('theme-modal-title').textContent='主题管理';">← 返回</button>
    <button class="btn btn-primary" onclick="doExtractWxTheme()">提取主题样式 →</button>
  `;
}

async function fetchWxArticle() {
  const url = document.getElementById('wx-url-input').value.trim();
  const proxy = document.getElementById('wx-proxy-input').value.trim();
  const status = document.getElementById('wx-fetch-status');
  if (!url) { status.textContent = '请输入文章链接'; return; }
  const fetchUrl = proxy ? proxy + encodeURIComponent(url) : url;
  status.style.color = 'var(--text-muted, #888)';
  status.textContent = '正在获取…';
  try {
    const res = await fetch(fetchUrl);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    document.getElementById('wx-html-input').value = text;
    // Switch to HTML tab
    const allBtns  = document.querySelectorAll('#theme-modal-bd .tab-btn');
    const allPanes = document.querySelectorAll('#theme-modal-bd .tab-pane');
    allBtns.forEach(b => b.classList.remove('active'));
    allPanes.forEach(p => p.classList.remove('active'));
    allBtns[0].classList.add('active');
    document.getElementById('ext-tab-html').classList.add('active');
    status.style.color = '#07c160';
    status.textContent = '✓ 获取成功，已粘贴到上方，点击「提取主题样式」继续';
  } catch (e) {
    status.style.color = '#e74c3c';
    status.textContent = '获取失败：' + e.message + '。建议改用「粘贴 HTML」方式。';
  }
}

function doExtractWxTheme() {
  const html = document.getElementById('wx-html-input').value.trim();
  const errEl = document.getElementById('wx-extract-status');
  if (!html) {
    errEl.textContent = '请先粘贴文章 HTML 源码，或通过链接获取';
    return;
  }
  errEl.textContent = '';
  try {
    const base = document.getElementById('wx-base-select')?.value || 'default';
    const extracted = extractThemeFromHtml(html, base);
    showThemeEditor(null, extracted);
    showToast('✓ 样式已提取，调整后点击「保存主题」');
  } catch (e) {
    errEl.textContent = '提取失败：' + e.message;
  }
}

/**
 * Parse WeChat article HTML and extract theme vars + style overrides.
 * @param {string} html - Full article HTML source
 * @param {string} base - Base theme to inherit ('default' | 'tech' | 'literary')
 * @returns {{ name, base, vars, styleOverrides }}
 */
function extractThemeFromHtml(html, base = 'default') {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // WeChat article content container
  const content =
    doc.querySelector('#js_content') ||
    doc.querySelector('.rich_media_content') ||
    doc.querySelector('article') ||
    doc.body;

  function all(tag) {
    return Array.from(content.querySelectorAll(tag));
  }

  // Normalize any color string to lowercase #rrggbb, or null
  function toHex(colorStr) {
    if (!colorStr) return null;
    colorStr = colorStr.trim();
    if (!colorStr || colorStr === 'transparent' || colorStr === 'inherit' || colorStr === 'initial') return null;
    if (/^#[0-9a-f]{6}$/i.test(colorStr)) return colorStr.toLowerCase();
    if (/^#[0-9a-f]{3}$/i.test(colorStr)) {
      const [, r, g, b] = colorStr;
      return ('#' + r + r + g + g + b + b).toLowerCase();
    }
    const m = colorStr.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (m) {
      return '#' + [m[1], m[2], m[3]]
        .map(n => parseInt(n).toString(16).padStart(2, '0')).join('');
    }
    return null;
  }

  // Find the most representative paragraph/section
  const pEls = all('p, section').filter(el =>
    el.style.cssText && el.textContent.trim().length > 10
  );
  const firstP = pEls[0] || null;

  // Font size
  let fontSize = 15;
  if (firstP?.style.fontSize) {
    const v = parseInt(firstP.style.fontSize);
    if (v >= 10 && v <= 30) fontSize = v;
  }

  // Line height (may be "1.75em", "1.75", "28px", etc.)
  let lineHeight = 1.75;
  if (firstP?.style.lineHeight) {
    const lhStr = firstP.style.lineHeight;
    const lhNum = parseFloat(lhStr);
    if (!isNaN(lhNum)) {
      lineHeight = lhStr.includes('px')
        ? Math.round((lhNum / fontSize) * 100) / 100
        : Math.round(lhNum * 100) / 100;
      if (lineHeight < 1 || lineHeight > 3) lineHeight = 1.75;
    }
  }

  // Text color
  let textColor = '#333333';
  if (firstP?.style.color) {
    const c = toHex(firstP.style.color);
    if (c) textColor = c;
  }

  // Font family
  let fontFamily = '';
  if (firstP?.style.fontFamily) {
    fontFamily = firstP.style.fontFamily.trim();
  }

  // Accent color: links first, then headings/strong
  let accentColor = '#07c160';
  const linkEls = all('a').filter(el => el.style.color);
  if (linkEls.length > 0) {
    const c = toHex(linkEls[0].style.color);
    if (c && c !== textColor) accentColor = c;
  } else {
    const headEls = all('h1, h2, h3, strong').filter(el => el.style.color);
    if (headEls.length > 0) {
      const c = toHex(headEls[0].style.color);
      if (c && c !== textColor) accentColor = c;
    }
  }

  // Muted color: blockquote or secondary spans
  let mutedColor = '#666666';
  const bqEls = all('blockquote').filter(el => el.style.color);
  if (bqEls.length > 0) {
    const c = toHex(bqEls[0].style.color);
    if (c) mutedColor = c;
  }

  // Build styleOverrides from representative elements' inline styles
  const styleOverrides = {};
  const tagMap = {
    h1: all('h1').find(el => el.style.cssText),
    h2: all('h2').find(el => el.style.cssText),
    h3: all('h3').find(el => el.style.cssText),
    p: firstP,
    blockquote: all('blockquote').find(el => el.style.cssText),
  };
  Object.entries(tagMap).forEach(([tag, el]) => {
    if (!el?.style?.cssText) return;
    const cleaned = el.style.cssText.trim().replace(/\s+/g, ' ');
    if (cleaned) styleOverrides[tag] = cleaned;
  });

  // Infer a theme name from the article title if available
  const titleEl = doc.querySelector('h1.rich_media_title, .rich_media_title, h1');
  const articleTitle = titleEl?.textContent?.trim() || '';
  const name = articleTitle ? articleTitle.slice(0, 20) + ' 风格' : '公众号提取';

  return {
    name,
    base,
    vars: {
      accentColor,
      textColor,
      mutedColor,
      fontSize,
      lineHeight,
      ...(fontFamily ? { fontFamily } : {}),
    },
    styleOverrides,
  };
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   Notion Integration
═══════════════════════════════════════════════════════════ */

function notionRichTextToMd(richTexts) {
  if (!richTexts || !richTexts.length) return '';
  return richTexts.map(rt => {
    let text = rt.plain_text || '';
    if (!text) return '';
    const a = rt.annotations || {};
    // Order matters: code first (don't nest bold inside code)
    if (a.code)          text = '`' + text + '`';
    else {
      if (a.bold)          text = '**' + text + '**';
      if (a.italic)        text = '*' + text + '*';
      if (a.strikethrough) text = '~~' + text + '~~';
    }
    if (rt.href)         text = '[' + text + '](' + rt.href + ')';
    return text;
  }).join('');
}

function notionBlocksToMd(blocks) {
  let md = '';
  let prevListType = null;

  for (const block of blocks) {
    const type = block.type;
    const isList = type === 'bulleted_list_item' || type === 'numbered_list_item';
    if (!isList && prevListType) { md += '\n'; prevListType = null; }

    switch (type) {
      case 'paragraph': {
        const t = notionRichTextToMd(block.paragraph?.rich_text);
        md += (t || '') + '\n\n';
        break;
      }
      case 'heading_1':
        md += '# ' + notionRichTextToMd(block.heading_1?.rich_text) + '\n\n';
        break;
      case 'heading_2':
        md += '## ' + notionRichTextToMd(block.heading_2?.rich_text) + '\n\n';
        break;
      case 'heading_3':
        md += '### ' + notionRichTextToMd(block.heading_3?.rich_text) + '\n\n';
        break;
      case 'bulleted_list_item':
        prevListType = 'ul';
        md += '- ' + notionRichTextToMd(block.bulleted_list_item?.rich_text) + '\n';
        break;
      case 'numbered_list_item':
        prevListType = 'ol';
        md += '1. ' + notionRichTextToMd(block.numbered_list_item?.rich_text) + '\n';
        break;
      case 'to_do': {
        const checked = block.to_do?.checked ? '[x]' : '[ ]';
        md += '- ' + checked + ' ' + notionRichTextToMd(block.to_do?.rich_text) + '\n';
        prevListType = 'ul';
        break;
      }
      case 'toggle':
        md += '- ' + notionRichTextToMd(block.toggle?.rich_text) + '\n';
        prevListType = 'ul';
        break;
      case 'code': {
        const lang = block.code?.language || '';
        const code = notionRichTextToMd(block.code?.rich_text);
        md += '```' + lang + '\n' + code + '\n```\n\n';
        break;
      }
      case 'quote':
        md += '> ' + notionRichTextToMd(block.quote?.rich_text) + '\n\n';
        break;
      case 'callout': {
        const icon = block.callout?.icon?.emoji ? block.callout.icon.emoji + ' ' : '';
        md += '> ' + icon + notionRichTextToMd(block.callout?.rich_text) + '\n\n';
        break;
      }
      case 'divider':
        md += '---\n\n';
        break;
      case 'image': {
        const imgUrl = block.image?.type === 'external'
          ? block.image.external?.url
          : block.image?.file?.url;
        const caption = notionRichTextToMd(block.image?.caption) || '图片';
        if (imgUrl) md += `![${caption}](${imgUrl})\n\n`;
        break;
      }
      case 'equation':
        md += '`' + (block.equation?.expression || '') + '`\n\n';
        break;
      case 'table':
        // Table rows come as child blocks; simplified placeholder
        md += '_[表格 - 请参考原始 Notion 页面]_\n\n';
        break;
      default:
        break;
    }
  }
  if (prevListType) md += '\n';
  return md;
}

function extractNotionPageId(input) {
  input = (input || '').trim();
  // UUID with dashes: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  const uuid = input.match(/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/i);
  if (uuid) return uuid[1].replace(/-/g, '');
  // Plain 32-char hex (possibly at end of URL)
  const hex32 = input.match(/([a-f0-9]{32})(?:\?|$|#)/i) || input.match(/([a-f0-9]{32})/i);
  if (hex32) return hex32[1];
  return input;
}

function setNotionStatus(msg, type) {
  const el = document.getElementById('notion-status');
  el.textContent = msg;
  el.className = 'ns show ' + type;
}

async function fetchNotion() {
  const token    = document.getElementById('notion-token').value.trim();
  const pageInput = document.getElementById('notion-page').value.trim();
  const proxyRaw  = document.getElementById('notion-proxy').value.trim();
  const autoCopy  = document.getElementById('notion-auto-copy').checked;

  if (!token)     { setNotionStatus('请输入 Integration Token', 'err'); return; }
  if (!pageInput) { setNotionStatus('请输入页面 URL 或 ID', 'err'); return; }

  const pageId = extractNotionPageId(pageInput);
  if (pageId.length < 10) { setNotionStatus('无法识别页面 ID，请检查输入', 'err'); return; }

  setNotionStatus('连接 Notion 中…', 'loading');
  const fetchBtn = document.getElementById('notion-fetch-btn');
  fetchBtn.disabled = true;

  // persist token / proxy
  localStorage.setItem('notion_token', token);
  if (proxyRaw) localStorage.setItem('notion_proxy', proxyRaw);

  // Build base URL.  proxy may be: "https://corsproxy.io/?url=" or "http://localhost:3100/"
  // We'll encode the target URL if proxy ends with "url="
  function buildUrl(notionPath) {
    const target = 'https://api.notion.com/v1' + notionPath;
    if (!proxyRaw) return target;
    if (proxyRaw.toLowerCase().endsWith('url=')) return proxyRaw + encodeURIComponent(target);
    return proxyRaw.replace(/\/$/, '') + '/' + target.replace('https://', '');
  }

  const headers = {
    'Authorization': 'Bearer ' + token,
    'Notion-Version': '2022-06-28',
  };

  try {
    // 1. Verify page exists
    const pageRes = await fetch(buildUrl('/pages/' + pageId), { headers });
    if (!pageRes.ok) {
      const err = await pageRes.json().catch(() => ({}));
      throw new Error(err.message || 'HTTP ' + pageRes.status + ' — 请确认页面已分享给该 Integration');
    }
    const pageData = await pageRes.json();
    const pageTitle = pageData.properties?.title?.title?.[0]?.plain_text
      || pageData.properties?.Name?.title?.[0]?.plain_text
      || '未命名';

    setNotionStatus('已找到页面「' + pageTitle + '」，正在获取内容…', 'loading');

    // 2. Fetch all blocks (paginated)
    let allBlocks = [];
    let cursor;
    do {
      const path = '/blocks/' + pageId + '/children?page_size=100' + (cursor ? '&start_cursor=' + cursor : '');
      const res = await fetch(buildUrl(path), { headers });
      if (!res.ok) throw new Error('获取块内容失败 HTTP ' + res.status);
      const data = await res.json();
      allBlocks = allBlocks.concat(data.results || []);
      cursor = data.has_more ? data.next_cursor : undefined;
    } while (cursor);

    if (!allBlocks.length) {
      setNotionStatus('页面内容为空', 'err');
      fetchBtn.disabled = false;
      return;
    }

    // 3. Convert blocks to Markdown
    let md = '# ' + pageTitle + '\n\n' + notionBlocksToMd(allBlocks);

    // 4. Load into editor and render
    editor.value = md;
    render();
    setNotionStatus(`✓ 已导入 ${allBlocks.length} 个块，共 ${md.length} 字符`, 'ok');

    // 5. Optionally auto-copy rich text
    if (autoCopy) {
      await copyRichText();
    }

    setTimeout(() => closeModal('notion-modal'), 1800);
  } catch (e) {
    let msg = e.message || '未知错误';
    if (msg.toLowerCase().includes('failed to fetch') || msg.toLowerCase().includes('cors') || msg.toLowerCase().includes('networkerror')) {
      msg = '跨域请求被拦截（CORS）。\n请在上方填入 CORS 代理前缀，例如：https://corsproxy.io/?url=\n或安装浏览器 CORS 插件后重试。';
    }
    setNotionStatus('错误：' + msg, 'err');
  } finally {
    fetchBtn.disabled = false;
  }
}
</script>
</body>
</html>
